name: Publish the demo

# On demand only, for now, so that pushing to this repository does not publish
# anything by itself. Add `push: { branches: [main] }` when the demo is meant
# to go live on every change.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A run already under way is left to finish, so a
# half-uploaded site is never what ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the demo
        uses: actions/checkout@v4

      # Node is only needed for the browser check below. The page itself loads
      # the grid from jsDelivr by script tag, so there is nothing to install
      # and the checked-out tree is exactly what gets published.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The offline check is the gate: it needs nothing but the repository,
      # so a run is never red because somebody else's service is down. This
      # is the full offline suite, the saved copy, the fallback and the
      # blocked-endpoint handling, run unweakened.
      - name: Check the page works with the endpoint unreachable
        env:
          OFFLINE: '1'
        run: node tools/verify.mjs

      # Informational only: the live NHSBSA endpoint is outside this repo's
      # control and has been intermittent from GitHub's runners, so its
      # failure must not block a deploy the offline gate above has already
      # passed. continue-on-error keeps the job green either way; the next
      # step leaves a visible note of what happened.
      - name: Check the page works against the live endpoint
        id: live_check
        continue-on-error: true
        run: node tools/verify.mjs

      - name: Note the live endpoint check's result
        if: always()
        run: |
          if [ "${{ steps.live_check.outcome }}" = "success" ]; then
            echo "Live endpoint check: passed." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The live NHSBSA endpoint check did not pass (outcome: ${{ steps.live_check.outcome }}). This does not block the deploy, which is gated on the offline check above; see the 'Check the page works against the live endpoint' step's log for details." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to Pages
        id: deployment
        uses: actions/deploy-pages@v4
