<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>What England prescribes, live</title>
    <meta
      name="description"
      content="Every prescription item dispensed in England, around eighteen million rows a month, queried live in the browser. The grid turns its own scrolling, sorting, searching and filtering into SQL and sends it to the NHS open data endpoint. Built with Lattice Grid loaded by script tag, with no install and no build."
    />
    <link rel="icon" href="data:," />
    <!--
      The grid's stylesheet and scripts come from the Lattice Grid CDN, and every
      address names an exact release so the page never quietly picks up a
      different build. The release is set once, here.
    -->
    <script>
      var GRID_BASE = 'https://cdn.latticegrid.dev/lattice-grid@1.123.3/';
      var GRID_STAMP = '20261116';
      document.write(
        '<link rel="stylesheet" href="' + GRID_BASE + 'lattice-grid.min.css?v=' + GRID_STAMP + '" />',
      );
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <div class="loading">
        <h1>What England prescribes, live</h1>
        <p class="loading-message">Starting...</p>
      </div>
    </main>

    <!--
      The library, as classic script tags. No npm install, no bundler, no
      `type="module"`: each file runs as it arrives and leaves a global behind.

        lattice-grid.min.js          LatticeGrid            the grid itself
        modules/charts.min.js        LatticeGrid.createChart  (extends the core, so it must follow it)
        modules/data-router.min.js   LatticeGridDataRouter
        modules/kpi.min.js           LatticeGridKPI
        modules/tabs.min.js          LatticeGridTabs

      The order matters once: the charts module folds itself into the core
      global rather than defining its own, so the core has to be there first.
      The other three are self-contained and could go in any order.
    -->
    <script>
      ['lattice-grid.min.js', 'modules/charts.min.js', 'modules/data-router.min.js', 'modules/kpi.min.js', 'modules/tabs.min.js'].forEach(
        function (file) {
          document.write('<script src="' + GRID_BASE + file + '?v=' + GRID_STAMP + '"><\/script>');
        },
      );
    </script>

    <!-- The demo's own code, in the order each file needs the one before it. -->
    <script src="./src/licence.js"></script>
    <script src="./src/epd-data.js"></script>
    <script src="./src/epd-source.js"></script>
    <script src="./src/dashboard.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
